# Pages CMS configuration: edit the site at https://app.pagescms.org
media:
  input: public/images
  output: /images

content:
  - name: profile
    label: Profile
    type: file
    path: src/data/profile.json
    format: json
    fields:
      - { name: name, label: Name, type: string }
      - { name: title, label: Title under your name, type: string }
      - { name: location, label: Location, type: string }
      - { name: intro, label: Home page introduction, type: text }
      - { name: now, label: Now (home page list), type: string, list: true }
      - { name: email, label: Email, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: instagram, label: Instagram URL, type: string }
      - { name: orcid, label: ORCID URL, type: string }
      - { name: github, label: GitHub URL, type: string }
      - { name: photo, label: Profile photo, type: image }
      - { name: cvPdf, label: CV PDF (leave empty to hide the download link), type: file }

  - name: about-settings
    label: About page (hero, quick facts, SEO)
    type: file
    path: src/data/about.json
    format: json
    fields:
      - { name: seoTitle, label: SEO title (browser tab), type: string, required: true }
      - { name: seoDescription, label: SEO description (search results and link previews), type: text }
      - { name: updated, label: Last updated, type: date }
      - { name: showPlaceholders, label: Show "photo to come" frames for photos not yet added, type: boolean }
      - name: hero
        label: Hero (section 01)
        type: object
        fields:
          - { name: eyebrow, label: Small label above your name, type: string }
          - { name: headline, label: Headline, type: text, required: true }
          - { name: intro, label: Introduction (leave a blank line between paragraphs), type: text }
          - { name: location, label: Location, type: string }
          - { name: portrait, label: Portrait photo (portrait orientation, 4:5 works best), type: image }
          - { name: portraitAlt, label: Portrait description for screen readers, type: string }
          - { name: portraitCaption, label: Portrait caption (optional), type: string }
          - name: portraitFocus
            label: Portrait focal point
            type: select
            options: { values: [center, top, bottom, left, right, top left, top right, bottom left, bottom right] }
      - name: quickFacts
        label: Quick facts
        type: object
        fields:
          - { name: visible, label: Show quick facts, type: boolean, default: true }
          - { name: title, label: Heading, type: string }
          - name: items
            label: Facts
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string, required: true }
              - { name: value, label: Value, type: string, required: true }

  - name: about
    label: About page sections
    type: collection
    path: src/content/about
    view:
      fields: [title, order, layout, visible]
      primary: title
      sort: [order]
      default: { sort: order, order: asc }
    fields:
      - { name: title, label: Section title, type: string, required: true }
      - { name: navLabel, label: Short name for the section menu (optional), type: string }
      - { name: eyebrow, label: Eyebrow (small label above the title), type: string }
      - { name: subtitle, label: Subtitle (one or two sentences under the title), type: text }
      - { name: order, label: Order (lower comes first; decimals are fine), type: number, required: true }
      - { name: visible, label: Show on the site, type: boolean, default: true }
      - name: layout
        label: Layout
        type: select
        options:
          values:
            - { value: text, label: Text only }
            - { value: image-left, label: Text with image left }
            - { value: image-right, label: Text with image right }
            - { value: full-image, label: Full-width image, then text }
            - { value: gallery, label: Text, then photo gallery (up to 4) }
            - { value: projects, label: Text, then project showcase }
            - { value: quote, label: Pull quote only (interlude between sections) }
            - { value: closing, label: Closing statement (last paragraph set large) }
      - name: images
        label: Images
        type: object
        list: true
        fields:
          - { name: src, label: Image (leave empty to keep a slot for later), type: image }
          - { name: alt, label: Description for screen readers, type: string }
          - { name: caption, label: Caption, type: string }
          - name: focus
            label: Focal point
            type: select
            options: { values: [center, top, bottom, left, right, top left, top right, bottom left, bottom right] }
      - name: pullQuote
        label: Pull quote (shown after the section)
        type: object
        fields:
          - { name: text, label: Quote, type: text }
          - { name: cite, label: Attribution (optional), type: string }
      - name: links
        label: Related links
        type: object
        list: true
        fields:
          - { name: label, label: Link text, type: string, required: true }
          - { name: href, label: Link (e.g. /projects/), type: string, required: true }
      - name: projects
        label: Projects to showcase (project layout only)
        type: reference
        options:
          collection: projects
          multiple: true
          search: title
          label: "{title}"
          value: "{path}"
      - { name: body, label: Text, type: rich-text }

  - name: writing
    label: Writing
    type: collection
    path: src/content/writing
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: description, label: Short description, type: text }
      - { name: draft, label: Draft (hidden from the site), type: boolean, default: true }
      - { name: body, label: Text, type: rich-text }

  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    view:
      fields: [title, status, featured]
      primary: title
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: One-sentence summary, type: text, required: true }
      - { name: role, label: Your role, type: string }
      - { name: years, label: Year(s), type: string, required: true }
      - { name: status, label: Status, type: string, required: true }
      - { name: stack, label: Built with, type: string, list: true }
      - name: code
        label: Code
        type: select
        options: { values: [Public, Private] }
      - { name: repo, label: GitHub link (public code only), type: string }
      - { name: link, label: Live app link, type: string }
      - { name: image, label: Screenshot, type: image }
      - { name: featured, label: Show on home page, type: boolean }
      - { name: order, label: Order (lower comes first), type: number }
      - { name: body, label: Description, type: rich-text }

  - name: creative
    label: Creative
    type: collection
    path: src/content/creative
    view:
      fields: [title, kind, years]
      primary: title
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: kind
        label: Kind
        type: select
        options: { values: [Design, Video, Editorial, Campaign] }
      - { name: client, label: For, type: string }
      - { name: years, label: Year(s), type: string }
      - { name: image, label: Image, type: image }
      - { name: link, label: Link (video, Behance, Instagram post), type: string }
      - { name: order, label: Order (lower comes first), type: number }
      - { name: body, label: Description, type: rich-text }

  - name: cv
    label: Experience
    type: collection
    path: src/content/cv
    view:
      fields: [title, organization, section]
      primary: title
    fields:
      - { name: title, label: Role or title, type: string, required: true }
      - { name: organization, label: Organisation, type: string, required: true }
      - { name: location, label: Location, type: string }
      - { name: period, label: Period as shown (e.g. August 2025 – February 2026), type: string, required: true }
      - { name: sort, label: Start date (for ordering), type: date, required: true }
      - name: section
        label: Section
        type: select
        options:
          values:
            - Research
            - Clinical
            - Education
            - Creative and communication
            - Organisations
            - Certificates and presentations
      - { name: body, label: Details, type: rich-text }
